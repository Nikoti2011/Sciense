<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meiosis: The Genetic Shuffler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const stages = [
      "Prophase I", "Metaphase I", "Anaphase I", "Telophase I",
      "Prophase II", "Metaphase II", "Anaphase II", "Telophase II"
    ];

    const descriptions = {
      "Prophase I": "Click chromosomes to CROSS OVER (swap colors).",
      "Metaphase I": "Click to align chromosomes in the center.",
      "Anaphase I": "Click to separate homologous chromosomes.",
      "Telophase I": "Cells split into two.",
      "Prophase II": "Prepare second division.",
      "Metaphase II": "Align again.",
      "Anaphase II": "Separate chromatids.",
      "Telophase II": "4 unique haploid cells form."
    };

    function App() {
      const [stageIndex, setStageIndex] = useState(0);
      const [chromosomes, setChromosomes] = useState([
        { id: 1, x: 60, y: 80, color: "#ef4444" },
        { id: 2, x: 140, y: 80, color: "#3b82f6" }
      ]);
      const [selected, setSelected] = useState([]);

      const currentStage = stages[stageIndex];

      const nextStage = () => {
        setStageIndex((prev) => (prev + 1) % stages.length);
      };

      const handleChromosomeClick = (id) => {
        if (currentStage === "Prophase I") {
          let newSelected = [...selected];
          if (newSelected.includes(id)) {
            newSelected = newSelected.filter(s => s !== id);
          } else {
            newSelected.push(id);
          }

          if (newSelected.length === 2) {
            const [a, b] = newSelected;
            const updated = chromosomes.map(c => {
              if (c.id === a) return { ...c, color: chromosomes.find(x => x.id === b).color };
              if (c.id === b) return { ...c, color: chromosomes.find(x => x.id === a).color };
              return c;
            });
            setChromosomes(updated);
            newSelected = [];
          }

          setSelected(newSelected);
        }

        if (currentStage === "Metaphase I") {
          setChromosomes(chromosomes.map((c, i) => ({ ...c, x: 90 + i * 40, y: 100 })));
        }

        if (currentStage === "Anaphase I") {
          setChromosomes(chromosomes.map((c, i) => ({ ...c, x: i === 0 ? 30 : 170 })));
        }

        if (currentStage === "Metaphase II") {
          setChromosomes(chromosomes.map((c, i) => ({ ...c, y: 100 })));
        }

        if (currentStage === "Anaphase II") {
          setChromosomes(chromosomes.map((c, i) => ({ ...c, y: i % 2 === 0 ? 40 : 160 })));
        }
      };

      useEffect(() => {
        if (currentStage === "Telophase II") {
          setChromosomes([
            { id: 1, x: 30, y: 40, color: "#ef4444" },
            { id: 2, x: 170, y: 40, color: "#3b82f6" },
            { id: 3, x: 30, y: 160, color: "#a855f7" },
            { id: 4, x: 170, y: 160, color: "#22c55e" }
          ]);
        }
      }, [currentStage]);

      return (
        <div className="p-6">
          <h1 className="text-3xl font-bold text-purple-400 mb-4">
            🧬 Meiosis: The Genetic Shuffler
          </h1>

          {/* Controls */}
          <div className="mb-4 flex gap-2">
            <button onClick={nextStage} className="bg-purple-600 px-3 py-1 rounded">
              Next Step ▶
            </button>
          </div>

          {/* Stage Info */}
          <div className="mb-4">
            <h2 className="text-xl font-bold">{currentStage}</h2>
            <p className="text-gray-300">{descriptions[currentStage]}</p>
          </div>

          {/* Cell */}
          <div className="relative w-full h-72 bg-gray-800 rounded overflow-hidden border border-gray-700">
            {chromosomes.map(c => (
              <div
                key={c.id}
                onClick={() => handleChromosomeClick(c.id)}
                className="absolute w-6 h-12 rounded cursor-pointer transition-all duration-500 hover:scale-110"
                style={{
                  left: c.x,
                  top: c.y,
                  backgroundColor: c.color,
                  outline: selected.includes(c.id) ? "2px solid white" : "none"
                }}
              />
            ))}
          </div>

          {/* Guidance */}
          <div className="mt-6 bg-gray-800 p-4 rounded">
            <h2 className="font-bold mb-2">🧠 What to do</h2>
            <p className="text-sm text-gray-300">
              Follow the instructions above. Click chromosomes to interact and simulate each stage.
              Try to understand HOW chromosomes move and WHY cells become different.
            </p>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
