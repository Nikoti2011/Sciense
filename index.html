<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meiosis: The Genetic Shuffler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const stages = [
      "Prophase I", "Metaphase I", "Anaphase I", "Telophase I",
      "Prophase II", "Metaphase II", "Anaphase II", "Telophase II"
    ];

    const descriptions = {
      "Prophase I": "Chromosomes pair and CROSS OVER (swap DNA).",
      "Metaphase I": "Pairs line up in the middle randomly.",
      "Anaphase I": "Pairs are pulled apart.",
      "Telophase I": "2 cells form.",
      "Prophase II": "Cells prepare again.",
      "Metaphase II": "Chromosomes line up again.",
      "Anaphase II": "Chromatids separate.",
      "Telophase II": "4 UNIQUE haploid cells form."
    };

    function App() {
      const [stageIndex, setStageIndex] = useState(0);
      const [autoPlay, setAutoPlay] = useState(true);
      const [chromosomes, setChromosomes] = useState([
        { id: 1, x: 50, y: 80, color: "#ef4444" },
        { id: 2, x: 120, y: 80, color: "#3b82f6" }
      ]);

      const currentStage = stages[stageIndex];

      // AUTO PROGRESSION
      useEffect(() => {
        if (!autoPlay) return;
        const interval = setInterval(() => {
          setStageIndex((prev) => (prev + 1) % stages.length);
        }, 2500);
        return () => clearInterval(interval);
      }, [autoPlay]);

      // ANIMATION LOGIC
      useEffect(() => {
        let updated = [...chromosomes];

        if (currentStage === "Metaphase I") {
          updated.forEach((c, i) => {
            c.x = 80 + i * 40;
            c.y = 100;
          });
        }

        if (currentStage === "Anaphase I") {
          updated.forEach((c, i) => {
            c.x = i === 0 ? 20 : 160;
          });
        }

        if (currentStage === "Telophase II") {
          updated = [
            { id: 1, x: 20, y: 50, color: "#ef4444" },
            { id: 2, x: 160, y: 50, color: "#3b82f6" },
            { id: 3, x: 20, y: 140, color: "#a855f7" },
            { id: 4, x: 160, y: 140, color: "#22c55e" }
          ];
        }

        setChromosomes(updated);
      }, [currentStage]);

      return (
        <div className="p-6">
          <h1 className="text-3xl font-bold text-purple-400 mb-4">
            🧬 Meiosis: The Genetic Shuffler
          </h1>

          {/* Controls */}
          <div className="mb-4 flex gap-2">
            <button
              onClick={() => setAutoPlay(!autoPlay)}
              className="bg-purple-600 px-3 py-1 rounded"
            >
              {autoPlay ? "Pause" : "Play"}
            </button>

            <button
              onClick={() => setStageIndex((stageIndex + 1) % stages.length)}
              className="bg-blue-600 px-3 py-1 rounded"
            >
              Next Stage
            </button>
          </div>

          {/* Stage Indicator */}
          <div className="mb-4">
            <h2 className="text-xl font-bold">{currentStage}</h2>
            <p className="text-gray-300">{descriptions[currentStage]}</p>
          </div>

          {/* Cell Visualization */}
          <div className="relative w-full h-64 bg-gray-800 rounded overflow-hidden">
            {chromosomes.map(c => (
              <div
                key={c.id}
                className="absolute w-6 h-12 rounded transition-all duration-700"
                style={{
                  left: c.x,
                  top: c.y,
                  backgroundColor: c.color
                }}
              />
            ))}
          </div>

          {/* Progress Bar */}
          <div className="mt-4 w-full bg-gray-700 h-2 rounded">
            <div
              className="bg-purple-500 h-2 rounded"
              style={{ width: `${(stageIndex / (stages.length - 1)) * 100}%` }}
            />
          </div>

          {/* Explanation Boost */}
          <div className="mt-6 bg-gray-800 p-4 rounded">
            <h2 className="font-bold mb-2">🧠 Why this matters</h2>
            <p className="text-sm text-gray-300">
              Meiosis creates genetic variation through crossing over and independent assortment.
              This is why siblings look different and why evolution happens.
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
